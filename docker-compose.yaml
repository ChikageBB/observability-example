services:
  remote-ubuntu:
    build:
      context: ./remote-ubuntu
    container_name: remote-ubuntu
    ports:
      - "2222:22"
      - "9100:9100"
    volumes:
      - remote-ubuntu-bin:/usr/local/bin
    networks:
      - observability-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    networks:
      - observability-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - observability-net
    volumes:
      - grafana-storage:/var/lib/grafana


networks:
  observability-net:
    driver: bridge

volumes:
  remote-ubuntu-bin:
  grafana-storage: